name: CI/CD for Min-URL

on:
  push:
    branches: ['master', 'develop']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: ['master', 'develop']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    env:
      PORT: 3001
      DATABASE_URL: postgres://admin:admin@localhost:5432/min_url_test
      ADMIN_URL: postgres://admin:admin@localhost:5432/postgres
      FRONTEND_URL: http://localhost:4321
      BACKEND_API_URL: http://localhost:3001
      TURNSTILE_SITEKEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      INTERNAL_SECRET: ci_test_internal_secret_at_least_32_characters
      CORS_ALLOWED_ORIGINS: http://localhost:4321,https://min-url.com,http://localhost:5173
      NODE_ENV: test
      REDIRECTOR_URL: http://localhost:3002
      REDIS_URL: localhost
      REDIS_PORT: 6379
      RATE_LIMIT_ENABLED: true
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 60
    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: min_url_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Turbo cache config
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            turbo-${{ github.job }}-

      # Install dependencies
      - name: Install dependencies
        run: bun install

      # Build Lint Test
      - name: Build Lint Test
        run: bun x turbo run build lint typecheck format:check test --cache-dir=".turbo"
