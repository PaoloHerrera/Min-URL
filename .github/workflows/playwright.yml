name: Playwright Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      PORT: 3001
      DB_NAME: min_url_test
      DB_USER: admin
      DB_PASS: admin
      DB_HOST: localhost
      DB_PORT: 5432
      API_KEY: ci_test_api_key_placeholder
      SECRET_HASH: ci_test_sec_hash
      LOCAL_IP: 127.0.0.1
      TURNSTILE_SITEKEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      CLOUDINARY_CLOUD_NAME: ci_test_cloudinary_cloud
      CLOUDINARY_API_KEY: ci_test_cloudinary_api_key
      CLOUDINARY_API_SECRET: ci_test_cloudinary_api_secret
      NODE_ENV: test
      REDIRECTOR_URL: http://localhost:3002
      SESSION_SECRET: ci_test_session_secret_at_least_32_characters
      REDIS_URL: localhost
      REDIS_PORT: 6379
    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: min_url_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Install dependencies
      - name: Install dependencies
        run: bun install

      # Initialize Database
      - name: Initialize Database
        run: PGPASSWORD=admin psql -h localhost -U admin -d min_url_test -f backend-services/db/init.sql

      # Install Playwright Browsers (Chromium only to speed up CI)
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      # Run Playwright E2E Tests
      - name: Run Playwright E2E Tests
        run: bunx playwright test

      # Upload Playwright Report on failure or cancellation
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
