name: Playwright Tests
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      PORT: 3001
      DATABASE_URL: postgres://admin:admin@localhost:5432/min_url_test
      ADMIN_URL: postgres://admin:admin@localhost:5432/postgres
      FRONTEND_URL: http://localhost:4321
      BACKEND_API_URL: http://localhost:3001
      INTERNAL_SECRET: ci_test_internal_secret_32_characters_min
      CORS_ALLOWED_ORIGINS: http://localhost:4321,https://min-url.com,http://localhost:5173
      TURNSTILE_SITEKEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      NODE_ENV: test
      REDIRECTOR_URL: http://localhost:3002
      REDIS_URL: localhost
      REDIS_PORT: 6379
    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: min_url_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Install dependencies
      - name: Install dependencies
        run: bun install

      # Initialize Database Migrations
      - name: Initialize Database Migrations
        run: bun --cwd apps/backend-services run db:migrate

      # Install Playwright Browsers (Chromium only to speed up CI)
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      # Run Playwright E2E Tests
      - name: Run Playwright E2E Tests
        run: bunx playwright test

      # Upload Playwright Report on failure or cancellation
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
